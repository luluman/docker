name: wireguard

on:
    push:
        paths:
            - "wireguard/wireguard.Dockerfile"
            - "wireguard/entrypoint.sh"
            - "wireguard/docker-compose.yml"

env:
    IMAGE_NAME: mattlu/wg-gotatun-exit
    LOCAL_TAG: wg-gotatun-exit

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Log in to Docker Hub
              run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            - name: Build WireGuard image
              working-directory: wireguard
              run: |
                  docker build . --file wireguard.Dockerfile --tag "$LOCAL_TAG"
                  docker image tag "$LOCAL_TAG" "$IMAGE_NAME:latest"

            # Publish the :latest tag to Docker Hub
            - name: Push WireGuard image
              run: docker push --all-tags "$IMAGE_NAME"
